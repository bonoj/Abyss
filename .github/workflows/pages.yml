name: Publish Abyss
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: abyss-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package without modifying experiments
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil
          sha=os.environ['BUILD_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          site=pathlib.Path('site')
          shutil.copytree('.',site,ignore=shutil.ignore_patterns('.git','.github','site','__pycache__','.DS_Store'))
          pages=sorted(p for p in site.rglob('index.html') if p.parent != site)
          assert pages,'No experiment folders containing index.html'
          folders=[p.parent.relative_to(site).as_posix() for p in pages]
          assert len(folders)==len(set(folders))
          (site/'build.json').write_text(json.dumps({'sha':sha},separators=(',',':'))+'\n')
          (site/'pages.json').write_text(json.dumps({'sha':sha,'pages':folders},separators=(',',':'))+'\n')
          print('UNMODIFIED EXPERIMENTS',folders,'SOURCE SHA',sha)
          PY
      - name: Bundle the complete Shell module graph
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          # Every local JS import is resolved into one immutable artifact.
          # External CDN imports remain external; no local source module is loaded by the browser.
          npm install --no-save --no-package-lock esbuild@0.25.12
          mkdir -p site/shell/assets
          ./node_modules/.bin/esbuild shell/main.js --bundle --format=esm --platform=browser --target=es2022 --external:https://* --outfile="site/shell/assets/main.${BUILD_SHA}.js"
          python3 - <<'PY'
          import os,pathlib,re
          sha=os.environ['BUILD_SHA']
          asset=pathlib.Path('site/shell/assets/main.'+sha+'.js')
          bundle=asset.read_text()
          assert len(bundle)>1000,'Bundle suspiciously small'
          assert not re.search(r'(?:from\\s*|import\\s*\\()\\s*[\\x22\\x27]\\.{1,2}/',bundle),'Unbundled local import'
          # Legacy cached Shell HTML imports main.js?build=SHA; preserve that
          # contract, but make the entry an immutable bundle loader.
          pathlib.Path('site/shell/main.js').write_text("import './assets/main."+sha+".js';\\n")
          # Assert the desired experiment is actually in the compiled artifact.
          assert 'flatlandia' in bundle,'Flatlandia absent from executable bundle'
          print('BUNDLED',asset,len(bundle),'bytes; no local module fetches')
          PY
      - name: Check packaged JavaScript syntax
        run: |
          find site -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n 1 node --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published experiment entries
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ['BUILD_SHA']
          base='https://bonoj.github.io/Abyss/'
          for attempt in range(36):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path+('?' if '?' not in path else '&')+'verify='+sha+'&attempt='+str(attempt),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r:return r.read()
                  manifest=json.loads(get('pages.json'))
                  assert manifest['sha']==sha
                  assert manifest['pages'],'No experiments published'
                  for folder in manifest['pages']:
                      html=get(folder+'/').lower()
                      assert b'<html' in html and b'</html>' in html,folder
                  print('VERIFIED',sha,manifest['pages'])
                  break
              except Exception as e:
                  print('Awaiting publication',attempt+1,str(e))
                  if attempt==35:raise
                  time.sleep(5)
          PY
